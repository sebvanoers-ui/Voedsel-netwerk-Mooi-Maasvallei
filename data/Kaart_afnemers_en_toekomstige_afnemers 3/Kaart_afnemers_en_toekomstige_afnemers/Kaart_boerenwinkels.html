<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huidige en toekomstige afnemers van Goei Gerei</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 0.75rem 1rem;
      background: #315c35;
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    #map {
      flex: 1;
      min-height: 0;
    }

    .municipality-legend {
      padding: 0.5rem 0.75rem;
      background: white;
      border-radius: 0.25rem;
      box-shadow: 0 1px 5px rgb(0 0 0 / 40%);
      line-height: 1.6;
    }

    .municipality-legend span {
      display: inline-block;
      width: 0.75rem;
      height: 0.75rem;
      margin-right: 0.4rem;
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 1px #333;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <header>
    <h1>Huidige en toekomstige afnemers van Goei Gerei</h1>
  </header>
  <main id="map" aria-label="Kaart van Nederland"></main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="gemeentegrenzen.js"></script>
  <script src="woonkernen.js"></script>
  <script src="leverlocaties.js"></script>
  <script>
    const map = L.map("map", { crs: L.CRS.EPSG3857 }).setView([52.1326, 5.2913], 8);
    map.attributionControl.addAttribution(
      'Gebouwcontouren: <a href="https://service.pdok.nl/lv/bag/wfs/v2_0">BAG/PDOK</a>'
    );
    const pdokBaseMap = L.tileLayer(
      "https://service.pdok.nl/kadaster/brt-achtergrondkaart/wmts/v2_0/standaard/EPSG:3857/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: 'Kaartgegevens: <a href="https://www.kadaster.nl/">Kadaster (BRT)</a>'
      }
    );
    pdokBaseMap.addTo(map);

    map.createPane("wantToDeliverMarkers");
    map.getPane("wantToDeliverMarkers").style.zIndex = "640";
    map.createPane("willDeliverMarkers");
    map.getPane("willDeliverMarkers").style.zIndex = "650";
    map.createPane("deliveringMarkers");
    map.getPane("deliveringMarkers").style.zIndex = "660";
    map.createPane("futureAutomataMarkers");
    map.getPane("futureAutomataMarkers").style.zIndex = "610";
    map.createPane("markerTooltips");
    map.getPane("markerTooltips").style.zIndex = "710";
    map.getPane("popupPane").style.zIndex = "720";

    const municipalities = {
      GM1982: { name: "Land van Cuijk", color: "#000000" },
      GM0893: { name: "Bergen", color: "#000000" },
      GM0907: { name: "Gennep", color: "#000000" }
    };
    const boundaryLayer = L.geoJSON(null, {
      attribution: 'Gemeentegrenzen: <a href="https://api.pdok.nl/cbs/gebiedsindelingen/ogc/v1/">CBS/PDOK</a>',
      style: feature => ({
        color: municipalities[feature.properties.statcode].color,
        weight: 3,
        opacity: 0.9,
        fill: true,
        fillOpacity: 0
      }),
      onEachFeature: (feature, layer) => {
        const municipality = municipalities[feature.properties.statcode];
        layer.bindPopup(`<strong>${municipality.name}</strong>`);
      }
    });

    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);
    const deliveryStatuses = {
      "Leveren": { color: "#2e7d32", pane: "deliveringMarkers", layer: L.featureGroup() },
      "Gaan leveren": { color: "#ef6c00", pane: "willDeliverMarkers", layer: L.featureGroup() },
      "Willen leveren": { color: "#d73027", pane: "wantToDeliverMarkers", layer: L.featureGroup() }
    };
    const futureAutomata = {
      name: "Mogelijke toekomstige dorpsautomaten",
      color: "#1976d2",
      layer: L.featureGroup()
    };
    window.deliveryRecords.forEach(delivery => {
      const status = deliveryStatuses[delivery.status];
      if (!status) {
        throw new Error(`Onbekende leverstatus voor ${delivery.name}: ${delivery.status}`);
      }
      if (!Number.isFinite(delivery.latitude) || !Number.isFinite(delivery.longitude)) {
        throw new Error(`Ongeldige coördinaten voor ${delivery.name}`);
      }

      const link = new URL(delivery.url);
      if (link.protocol !== "http:" && link.protocol !== "https:") {
        throw new Error(`Ongeldige link voor ${delivery.name}`);
      }

      const popup = [
        `<strong>${escapeHtml(delivery.name)}</strong>`,
        `Status: ${escapeHtml(delivery.status)}`,
        `Adres: ${escapeHtml(delivery.address)}`,
        `<a href="${escapeHtml(link.href)}" target="_blank" rel="noopener noreferrer">Website / bron</a>`
      ].join("<br>");
      const marker = L.circleMarker(L.latLng(delivery.latitude, delivery.longitude), {
        pane: status.pane,
        interactive: true,
        radius: 6,
        color: "#ffffff",
        weight: 1.5,
        fillColor: status.color,
        fillOpacity: 0.95
      })
        .bindTooltip(escapeHtml(delivery.name), { pane: "markerTooltips" })
        .bindPopup(popup);

      marker.addTo(status.layer);
    });

    const villageLayer = L.featureGroup();
    window.villageRecords.forEach(village => {
      if (!Number.isFinite(village.latitude) || !Number.isFinite(village.longitude)) {
        throw new Error(`Ongeldige coördinaten voor woonkern ${village.name}`);
      }

      L.circleMarker(L.latLng(village.latitude, village.longitude), {
        pane: "futureAutomataMarkers",
        interactive: true,
        radius: 6,
        color: "#ffffff",
        weight: 1.5,
        fillColor: futureAutomata.color,
        fillOpacity: 0.95
      })
        .bindPopup(`<strong>${escapeHtml(village.name)}</strong>`)
        .bindTooltip(escapeHtml(village.name), { pane: "markerTooltips" })
        .addTo(villageLayer);
    });
    futureAutomata.layer.addLayer(villageLayer);

    L.control.layers(
      {
        "PDOK (BRT)": pdokBaseMap
      },
      {
        "Gemeentegrenzen": boundaryLayer,
        ...Object.entries(deliveryStatuses).reduce((layers, [status, details]) => {
          const label = `Leverlocaties - ${status}`;
          layers[label] = details.layer;
          return layers;
        }, {}),
        [futureAutomata.name]: futureAutomata.layer
      }
    ).addTo(map);

    const municipalityLegend = L.control({ position: "bottomright" });
    municipalityLegend.onAdd = () => {
      const legend = L.DomUtil.create("div", "municipality-legend");
      const statusItems = Object.entries(deliveryStatuses)
        .map(([status, details]) =>
          `<div><span style="background:${details.color}"></span>${escapeHtml(status)}</div>`
        )
        .join("") +
        `<div><span style="background:${futureAutomata.color}"></span>${escapeHtml(futureAutomata.name)}</div>`;
      legend.innerHTML = statusItems;
      return legend;
    };
    municipalityLegend.addTo(map);

    const features = window.municipalityBoundaries.features.filter(feature =>
      Object.prototype.hasOwnProperty.call(municipalities, feature.properties.statcode)
    );
    if (features.length !== Object.keys(municipalities).length) {
      throw new Error("Niet alle drie de gemeentegrenzen zijn beschikbaar");
    }

    boundaryLayer.addData({ type: "FeatureCollection", features });
    boundaryLayer.addTo(map);
    Object.values(deliveryStatuses).forEach(status => status.layer.addTo(map));
    futureAutomata.layer.addTo(map);
    map.fitBounds(
      boundaryLayer.getBounds()
        .extend(L.featureGroup([
          ...Object.values(deliveryStatuses).map(status => status.layer),
          futureAutomata.layer
        ]).getBounds()),
      { padding: [20, 20] }
    );
  </script>
</body>
</html>
